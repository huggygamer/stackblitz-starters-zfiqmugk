<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Container</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        #vm-container {
            width: 900px;
            height: 600px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #vm-container:fullscreen {
            width: 100vw;
            height: 100vh;
            border: none;
            border-radius: 0;
        }

        /* Floating Fullscreen Button */
        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .fullscreen-btn:hover {
            background: rgba(50, 50, 50, 0.9);
        }
        
        .vm-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="vm-container">
        <button class="fullscreen-btn" id="fs-btn">Fullscreen</button>
        <iframe class="vm-frame" src="https://www.winfy.net/runwine/index.php?os=winegui_2_ubuntu-22-amd64"></iframe>
    </div>

    <script>
        const container = document.getElementById('vm-container');
        const fsBtn = document.getElementById('fs-btn');

        // Click once on the button to toggle Fullscreen
        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.log("Fullscreen request failed:", err);
                });
            } else {
                document.exitFullscreen().catch(err => {
                    console.log("Exit fullscreen failed:", err);
                });
            }
        });

        // Update button text automatically based on fullscreen state
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fsBtn.textContent = "Fullscreen";
            } else {
                fsBtn.textContent = "Exit Fullscreen";
            }
        });
    </script>
</body>
</html>
